<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pingu Stardine">
  <!-- Star on the brand base tone. The mark is a four-point sparkle rather than a
       letterform: it is what the character is, and it holds at 16px where a P
       would turn to mush. A star also avoids borrowing the cartoon penguin. -->
  <rect width="64" height="64" rx="32" fill="#ABC1E7" />
  <path
    d="M32 9c.9 10.2 4.6 14 15 15-10.4 1-14.1 4.8-15 15-.9-10.2-4.6-14-15-15 10.4-1 14.1-4.8 15-15Z"
    fill="#14203A"
  />
  <circle cx="45" cy="45" r="5" fill="#FCE27D" />
</svg>