    <meta

    <meta property="og:type" content="profile" />

    <meta property="og:locale" content="id_ID" />

    <meta
      property="og:description"
      content="Selamat datang di Starpaw Cafe, tempat nongkrongnya para stray cats. Stream, klip, dan fan art."
    />
    <meta property="og:url" content="https://pingu-stardine.vtube-info.xyz/" />

    <meta property="og:image:width" content="1200" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores WebP for touch icons, so this one stays PNG. -->
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pingu Stardine",
        "alternateName": ["@pinguvtuber", "@pingustardine"],
        "description": "Bintang nyasar yang jatuh ke bumi, sekarang menjalankan Cat Cafe. ID/EN VTuber, Live 2D.",
        "url": "https://pingu-stardine.vtube-info.xyz/",
        "image": "https://pingu-stardine.vtube-info.xyz/media/avatar-youtube.webp",
        "sameAs": [
          "https://www.youtube.com/@pinguvtuber",
          "https://x.com/pingustardine",
          "https://trakteer.id/pinguvtuber"
        ]
      }
    </script>

    <script>
      // Runs before first paint so the correct token set is already on screen.
      // Without this, a dark-mode visitor eats one light flash on every load.
      // The key must match STORAGE_KEY in src/lib/useTheme.ts, or the choice is
      // written under one name and read under another and the toggle dies
      // silently.
      (function () {
        try {
          var stored = localStorage.getItem("pingu-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
